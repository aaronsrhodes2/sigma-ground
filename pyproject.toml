[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mentat"
version = "1.5.0"
description = "Mentat — physics services (Sigma Ground, Quarksum, Materia, Deckard, Radiance) behind one MCP face"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
authors = [
    {name = "Aaron Rhodes"},
]
keywords = [
    "physics",
    "particles",
    "quarks",
    "mass",
    "sigma",
    "scalar-field",
    "nuclear",
    "atoms",
    "molecules",
    "matter",
    "dynamics",
    "science",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aaronsrhodes2/sigma-ground"
Repository = "https://github.com/aaronsrhodes2/sigma-ground"
Issues = "https://github.com/aaronsrhodes2/sigma-ground/issues"

[project.scripts]
# Mentat — the umbrella product; the MCP server is its public face.
mentat = "sigma_ground.inventory.__main__:main"
mentat-mcp = "sigma_ground.mcp.server:main"
# Back-compat aliases (the Python import root remains `sigma_ground`).
sigma-ground = "sigma_ground.inventory.__main__:main"
sigma-ground-mcp = "sigma_ground.mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
# MCP server + LLM-front-end deps. Installed only when the MCP layer is
# used; the core sigma_ground library remains zero-dependency.
mcp = [
    "mcp>=1.0",                # Anthropic MCP Python SDK (FastMCP)
    "scipy>=1.11",             # CODATA constants + numerics
    "pint>=0.23",              # unit conversion
    "sympy>=1.12",             # symbolic math
    "astropy>=6.0",            # astronomy data + ephemeris
    "periodictable>=1.7",      # element / isotope data
    "numpy>=1.26",             # array math (also a transitive scipy/astropy dep)
]
# Benchmark runners (Wolfram Alpha, Qwen via Ollama).
# Only needed for the comparison study; not for the MCP server itself.
benchmark = [
    "wolframalpha>=5.1",       # Wolfram Alpha free-tier API client
    "httpx>=0.27",             # async HTTP client for Ollama tool loop
    "python-dotenv>=1.0",      # auto-load env vars from dev-root .env
]
# Materials Project API client (elastic/dielectric DFT-computed properties;
# see sigma_ground/field/interface/materials_project_client.py). Requires
# a free API key -- see .env.reference.md for MATERIALS_PROJECT_API_KEY.
# Not needed for the core sigma_ground library or the MCP server.
materials_project = [
    "mp-api>=0.41",            # official Materials Project Python client (MPRester)
    "python-dotenv>=1.0",      # auto-load env vars from dev-root .env
]

[tool.setuptools.packages.find]
include = ["sigma_ground*"]

[tool.setuptools.package-data]
"sigma_ground.inventory" = ["data/*.json", "samples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "renderer/tests", "sigma_ground/field/interface", "sigma_ground/inventory", "sigma_ground/mcp"]

[tool.pip-compile]
dependencies = ["pip-compile"]
