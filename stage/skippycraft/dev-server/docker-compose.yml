# SkippyCraft dev server (Phase 0, misc/SKIPPYCRAFT_PLAN.md): Paper in Docker on skippy-pc, for the Captain alone.
#
#   cd stage/skippycraft/dev-server
#   SKIPPYCRAFT_EULA=TRUE MC_PLAYER=<his Minecraft name> docker compose up -d     # EULA: the Captain's own acceptance
#   docker compose logs -f skippycraft                                            # "Done (...)! For help" = ready
#
# itzg/minecraft-server brings Java 25 (Minecraft 26.x needs it) and downloads Paper itself (TYPE=PAPER). One player: online mode, a whitelist of his name,
# creative, peaceful, a flat world. Port 42565 (not Minecraft's default), bound to skippy-pc's tailnet address and localhost only.
# The world lives in ./data (gitignored); theaters go in as a data pack: export_mc.py --out data/world/datapacks.
# A live theater (theater.py) drives the server over RCON on 127.0.0.1:42575.
services:
  skippycraft:
    image: itzg/minecraft-server:java25
    container_name: skippycraft
    environment:
      EULA: "${SKIPPYCRAFT_EULA:-FALSE}"
      TYPE: PAPER
      VERSION: "${MC_VERSION:-26.3}"             # pinned: the client must match (Paper 26.3-231 checked 2026-10-30)
      MEMORY: 3G
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      WHITELIST: "${MC_PLAYER:-aaronsrhodes}"  # the Captain's Java profile; nobody else
      OPS: "${MC_PLAYER:-aaronsrhodes}"
      MODE: creative
      DIFFICULTY: peaceful
      SPAWN_MONSTERS: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      SPAWN_NPCS: "FALSE"
      LEVEL_TYPE: minecraft:flat
      GENERATE_STRUCTURES: "FALSE"
      MOTD: SkippyCraft
      ENABLE_COMMAND_BLOCK: "TRUE"     # the theater panels: a button on a command block records a request the service reads
      RESOURCE_PACK: "http://100.122.71.14:42566/skippycraft.zip"   # served by theater.py serve; arrives on join, no F3+T
      RESOURCE_PACK_ENFORCE: "FALSE"
      BROADCAST_RCON_TO_OPS: "FALSE"   # the theater service sends many commands; they must not scroll through his chat
    ports:
      - "127.0.0.1:42565:25565"
      - "100.122.71.14:42565:25565"   # skippy-pc on the tailnet
      - "127.0.0.1:42575:25575"       # RCON for the theater service: this PC only (password in data/server.properties)
      - "127.0.0.1:42576:25576"       # the SkippyCraft plugin's block writer (plugin/build.sh): this PC only
    volumes:
      - ./data:/data
    restart: "no"
